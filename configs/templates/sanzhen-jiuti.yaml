# 分析模版: 三诊九体培训动销及打卡学习情况
# 用途: 按片区→门店→员工维度汇总6月上半月销售数据，计算占比

name: "sanzhen-jiuti"
display_name: "三诊九体培训动销及打卡学习情况"
description: "按片区→门店→员工分组汇总销售金额，计算每个员工在连锁月度总销售额中的占比"

# ─── 列定义 ───
columns:
  - { title: "序号", source_field: "seq", format: "number", width: 6 }
  - { title: "片区", source_field: "area", format: "text", width: 12 }
  - { title: "门店", source_field: "store", format: "text", width: 18 }
  - { title: "姓名", source_field: "name", format: "text", width: 10 }
  - { title: "第三方员工ID", source_field: "employee_id", format: "text", width: 14 }
  - { title: "销售金额（6月1日-15日）", source_field: "sales_amount", format: "money", width: 20 }
  - { title: "占比", source_field: "percentage", format: "percent", width: 8 }
  - { title: "部门", source_field: "department", format: "text", width: 55 }

# ─── 分组维度 ───
group_by: ["片区", "门店", "员工ID"]

# ─── 匹配策略: 模版字段 → 数据字段 ───
match_key:
  template_fields: ["员工ID"]
  data_fields: ["销售店员ERPID"]

# ─── 排序 ───
sort_by:
  - { field: "seq", order: "asc" }

# ─── 汇总规则 ───
summary_rules:
  - { type: "sum", source_field: "销售金额", target_field: "sales_amount" }
  - { type: "percentage", source_field: "sales_amount", target_field: "percentage", base_field: "total_sales" }

# ─── 员工列表（共77行，按模版定义顺序） ───
