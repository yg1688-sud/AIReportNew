  - { seq: 4,  area: "九龙坡",   store: "龙康国药",       name: "龙康国药店合计",   employee_id: "STORE_004", department: "九龙坡片区" }
  - { seq: 5,  area: "九龙坡",   store: "九龙坡区15店",   name: "九龙坡15店合计",   employee_id: "STORE_005", department: "九龙坡片区" }
