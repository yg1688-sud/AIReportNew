# 分析模版: 月度销售汇总（示例）
# 用途: 按片区汇总月度销售数据

name: "monthly-summary"
display_name: "月度销售汇总"
description: "按片区+门店维度汇总月度销售数据，计算各片区占比"

columns:
  - { title: "序号", source_field: "seq", format: "number", width: 6 }
  - { title: "片区", source_field: "area", format: "text", width: 12 }
  - { title: "门店", source_field: "store", format: "text", width: 20 }
  - { title: "员工数", source_field: "employee_count", format: "number", width: 10 }
  - { title: "销售金额", source_field: "sales_amount", format: "money", width: 16 }
  - { title: "占比", source_field: "percentage", format: "percent", width: 8 }

group_by: ["片区", "门店"]

match_key:
  template_fields: ["门店"]
  data_fields: ["销售门店"]

sort_by:
  - { field: "sales_amount", order: "desc" }

summary_rules:
  - { type: "sum", source_field: "销售金额", target_field: "sales_amount" }
  - { type: "percentage", source_field: "sales_amount", target_field: "percentage", base_field: "total_sales" }

# 示例：按门店定义（不含员工维度）
employee_list:
