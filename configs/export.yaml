# AIExport 导出配置
#
# 模式：多查询 + 自动模版（v2.0）
#   python -m src.cli run                  # 运行全部查询组
#   python -m src.cli run -q sanzhen-jiuti # 仅运行指定组
#   python -m src.cli show-queries         # 查看所有查询组

# ─── 默认 SQL Server 连接（查询组未覆盖时使用） ───
server: "."
port: 1433
database: "Xinglin.YaoAn"
username: "sa"
password: "${DB_PASSWORD}"
timeout: 30

# ─── 全局输出目录 ───
output_dir: "output/exports"

# ═══════════════════════════════════════════════════════════════
# 多查询组配置
# 每个查询组可选择性覆盖连接 — 不写则使用根级默认连接
# ═══════════════════════════════════════════════════════════════
queries:

  # ─── 查询组1: 三诊九体 — 员工级别销售动销 ───
  sanzhen-jiuti:
    server: "."
    port: 1433
    database: "Xinglin.YaoAn"
    username: "sa"
    password: "${DB_PASSWORD}"
    timeout: 30

    detail_query: |
      SELECT
          os.ThirdOrderId AS 订单号,
          ogs.ThirdMedicineId AS 商品ERPID,
          ogs.CostPrice AS 成本价,
          ogs.Price AS 销售单价,
          ogs.Num AS 销售数量,
          ogs.PayAmount AS 销售金额,
          os.FullPayTime AS 支付时间,
          os.ThirdStoreId AS 销售门店ID,
          os.ThirdStoreName AS 销售门店,
          ogs.thirdstaffid AS 销售店员ERPID,
          ogs.thirdstaffname AS 销售店员姓名
      FROM PurchaseMedicineOrder os
      JOIN PurchaseMedicineOrderGood ogs
        ON os.PurchaseMedicineOrderId = ogs.PurchaseMedicineOrderId
        AND ogs.EnterpriseID = os.EnterpriseID
      WHERE os.EnterpriseID = '{{enterprise_id}}'
        AND ogs.ThirdMedicineId IN ({{medicine_ids}})
        AND os.FullPayTime >= '{{start_date}}'
        AND os.FullPayTime < '{{end_date}}'
        AND ogs.thirdstaffid IN ({{staff_ids}})

    summary_query: |
      SELECT SUM(CAST(ogs.PayAmount AS DECIMAL(18,2))) AS 总销售额
      FROM PurchaseMedicineOrderGood ogs
      JOIN PurchaseMedicineOrder os
        ON os.PurchaseMedicineOrderId = ogs.PurchaseMedicineOrderId
        AND ogs.EnterpriseID = os.EnterpriseID
      WHERE ogs.EnterpriseID = '{{enterprise_id}}'
        AND os.EnterpriseID = '{{enterprise_id}}'
        AND os.FullPayTime >= '{{start_date}} 00:00:00'
        AND os.FullPayTime < '{{end_date}} 00:00:00'

    parameters:
      enterprise_id: "68288c8975fb4fa1a4b94da70b9f2765"
      start_date: "2026-06-01"
      end_date: "2026-06-16"
      medicine_ids: "'852275','852276','852278','852279','852280','852281','852400','852402','852403','852254','852256','852257','852258','852261','852262','852263','852264','852265','852273'"
      staff_ids: "'14694','6653','9911','6562','12025','13477','14508','10181','2474','13401','8950','2486','9058','9613','10311','7607','2512','13398','13723','10401','14163','2729','5452','2906','2473','2456','11916','6576','8505','2417','9071','2938','14600','12678','6835','12626','7865','12979','7804','8654','11918','10244','14113','2033','2481','2519','6999','2522','9026','1997','4576','13158','2773','8708','4492','8069','7275','2885','9519','7722','3010','12045','13353','7711','2762','10385','5450','3632','9551','8014','15444','15714','8281','10219','9796','9876','2555','2592'"

    output_filename: "sanzhen-jiuti.xlsx"

    template:
      display_name: "三诊九体培训动销及打卡学习情况"
      group_by: ["销售门店"]
      match_key:
        template: ["员工ID"]
        data: ["销售店员ERPID"]
      sort_by:
        - field: "销售金额"
          order: "desc"
      value_field: "销售金额"

  # ─── 查询组2: 月度门店汇总 ───
  monthly-summary:
    server: "."
    port: 1433
    database: "Xinglin.YaoAn"
    username: "sa"
    password: "${DB_PASSWORD}"
    timeout: 30

    detail_query: |
      SELECT
          os.ThirdStoreId AS 销售门店ID,
          os.ThirdStoreName AS 销售门店,
          COUNT(DISTINCT ogs.thirdstaffid) AS 员工数,
          SUM(CAST(ogs.PayAmount AS DECIMAL(18,2))) AS 销售金额
      FROM PurchaseMedicineOrder os
      JOIN PurchaseMedicineOrderGood ogs
        ON os.PurchaseMedicineOrderId = ogs.PurchaseMedicineOrderId
        AND ogs.EnterpriseID = os.EnterpriseID
      WHERE os.EnterpriseID = '{{enterprise_id}}'
        AND ogs.ThirdMedicineId IN ({{medicine_ids}})
        AND os.FullPayTime >= '{{start_date}}'
        AND os.FullPayTime < '{{end_date}}'
        AND ogs.thirdstaffid IN ({{staff_ids}})
      GROUP BY os.ThirdStoreId, os.ThirdStoreName

    summary_query: |
      SELECT SUM(CAST(ogs.PayAmount AS DECIMAL(18,2))) AS 总销售额
      FROM PurchaseMedicineOrderGood ogs
      JOIN PurchaseMedicineOrder os
        ON os.PurchaseMedicineOrderId = ogs.PurchaseMedicineOrderId
        AND ogs.EnterpriseID = os.EnterpriseID
      WHERE ogs.EnterpriseID = '{{enterprise_id}}'
        AND os.EnterpriseID = '{{enterprise_id}}'
        AND os.FullPayTime >= '{{start_date}} 00:00:00'
        AND os.FullPayTime < '{{end_date}} 00:00:00'

    parameters:
      enterprise_id: "68288c8975fb4fa1a4b94da70b9f2765"
      start_date: "2026-06-01"
      end_date: "2026-06-16"
      medicine_ids: "'852275','852276','852278','852279','852280','852281','852400','852402','852403','852254','852256','852257','852258','852261','852262','852263','852264','852265','852273'"
      staff_ids: "'14694','6653','9911','6562','12025','13477','14508','10181','2474','13401','8950','2486','9058','9613','10311','7607','2512','13398','13723','10401','14163','2729','5452','2906','2473','2456','11916','6576','8505','2417','9071','2938','14600','12678','6835','12626','7865','12979','7804','8654','11918','10244','14113','2033','2481','2519','6999','2522','9026','1997','4576','13158','2773','8708','4492','8069','7275','2885','9519','7722','3010','12045','13353','7711','2762','10385','5450','3632','9551','8014','15444','15714','8281','10219','9796','9876','2555','2592'"

    output_filename: "monthly-summary.xlsx"

    template:
      display_name: "月度销售汇总（按门店）"
      group_by: ["销售门店"]
      match_key:
        template: ["门店"]
        data: ["销售门店"]
      sort_by:
        - field: "销售金额"
          order: "desc"
      value_field: "销售金额"

  # ─── 查询组3: 员工花名册（纯导出，不做分析） ───
  staff-list:
    server: "."
    port: 1433
    database: "Xinglin.YaoAn"
    username: "sa"
    password: "${DB_PASSWORD}"
    timeout: 30

    detail_query: |
      SELECT * FROM [dbo].[Staffs]
      WHERE EnterpriseID = '{{enterprise_id}}'
        AND BindStatus = 1

    parameters:
      enterprise_id: "68288c8975fb4fa1a4b94da70b9f2765"
      start_date: "2026-06-01"
      end_date: "2026-06-16"

    output_filename: "staff_list.xlsx"
    # 无 template → 纯导出模式，仅导出 .xlsx，不生成分析报告
