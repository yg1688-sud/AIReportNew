[pytest]
# TDD-oriented pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    slow: Tests that take longer to run (deselect with '-m "not slow"')
    unit: Unit tests
    integration: Integration tests

# Output
addopts = -v --tb=short --strict-markers
